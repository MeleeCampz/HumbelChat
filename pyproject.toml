# P3 #27: proper packaging metadata.
#
#   * Base install:        pip install -e .
#   * With local STT:      pip install -e .[stt]
#   * With vector RAG:     pip install -e .[rag-vector]
#   * Everything:          pip install -e .[all]
#   * Dev / test tooling:  pip install -e .[dev]
#
# Heavy STT (faster-whisper) and vector (fastembed) deps are optional extras —
# they were previously labelled "optional" in requirements.txt comments but
# were always installed. Both are imported lazily by the code (see
# bot_core/transcriber.py and kb/vector_db.py), so a base-only install imports
# and runs cleanly; they are only required when the corresponding feature is
# enabled.
#
# requirements.txt is retained for pin compatibility / `pip install -r`.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-ai-bot"
version = "0.1.0"
description = "Discord bot with AI chat, knowledge-base RAG, and voice recording"
readme = "README.md"
requires-python = ">=3.10"          # code uses `str | None` (PEP 604); dev env is 3.12
authors = [{ name = "discord-ai-bot" }]

dependencies = [
    # Core runtime (see requirements.txt for the matching pins).
    "python-dotenv==1.2.2",
    # [voice] pulls PyNaCl + davey (DAVE E2EE, mandatory for Discord voice
    # since 2026-03-01). libopus is a *system* package (e.g. `apt-get install
    # libopus0`) and is loaded by discord.py via ctypes at runtime.
    "discord.py[voice]==2.7.1",
    "cryptography==49.0.0",   # AES-256-GCM voice transport decryption
    "openai==2.44.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Local STT backend (STT_BACKEND=local): segment timestamps -> transcript.
stt = [
    "faster-whisper==1.2.1",
    "numpy==1.26.4",
]
# Vector retrieval (RAG_RETRIEVAL_METHOD=vector).
rag-vector = [
    "fastembed==0.8.0",
    "numpy==1.26.4",
]
# In-process CPU embeddings + cross-encoder reranking (EMBED_BACKEND=local /
# RERANK_ENABLED). Removes the per-request model swap on a single-model backend.
rag-cpu = [
    "sentence-transformers>=3.0,<5",
    "numpy==1.26.4",
]
all = [
    "faster-whisper==1.2.1",
    "fastembed==0.8.0",
    "sentence-transformers>=3.0,<5",
    "numpy==1.26.4",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    # The test suite imports numpy directly (tests/test_transcriber.py), so it
    # is a dev/test dependency in its own right.
    "numpy==1.26.4",
    # P3 #28: CI tooling (lint + type-check + coverage).
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pytest-cov==7.0.0",
]

[project.scripts]
# P3 #27: console entry point (main.py exposes run_bot()).
discord-ai-bot = "main:run_bot"

[tool.setuptools.packages.find]
where = ["."]
include = ["bot_core*", "commands*", "kb*", "utils*", "config*"]
# tests/ has an __init__.py (it is a test package, not runtime code) — exclude
# it from the installable wheel.
exclude = ["tests*", "temp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["bot_core", "commands", "kb", "utils", "config"]
omit = ["tests/*", "temp/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# P3 #28: gate on the *correctness* rules (syntax errors E9 + pyflakes F: unused
# imports, undefined names, unused variables, unreachable code, ...). Stylistic
# rules (E501 line-length, E402 import-order, B023, ...) are intentionally left
# out so the CI gate stays focused on real bugs and is green on the current
# tree; widen `select` as the codebase is cleaned up.
select = ["E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# P3 #28: legacy modules are intentionally *relaxed* for now (they predate
# type-checking and still carry real type debt). The new P3 modules below are
# held to --strict. CI enforces this with:
#   mypy --strict --follow-imports=skip <new modules>

[[tool.mypy.overrides]]
module = ["bot_core.ai_runs"]
strict = true

[[tool.mypy.overrides]]
module = ["commands.ai_stop_command"]
strict = true

[[tool.mypy.overrides]]
module = ["utils.typing_loop"]
strict = true
