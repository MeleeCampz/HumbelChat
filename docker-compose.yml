# ──────────────────────────────────────────────────────────────
# HumbelChat Discord bot — production deployment (see docs/docker.md)
#
#   docker compose up -d --build    # build (if needed) + start
#   docker compose logs -f bot      # live logs
#   docker compose restart bot      # graceful-ish restart
#   docker compose down             # stop
#
# All runtime state lives in the bind-mounted host directories next to this
# file: data/ (KB + vector index + history), logs/, hf-cache/
# (HuggingFace model cache). Nothing important is inside the image.
# ──────────────────────────────────────────────────────────────
services:
  bot:
    build: .
    container_name: humbelchat-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # Pin runtime data paths to the bind mounts (defaults in config/settings.py
      # resolve relative to /app, which is equivalent — explicit for clarity).
      KB_PATH: /app/data/knowledge
      CHARACTERS_FILE: /app/characters.json
    volumes:
      - ./data:/app/data        # KB docs + .vector_index_cache + history.json
      - ./logs:/app/logs        # RotatingFileHandler output, readable from host
      - ./hf-cache:/models/hf   # bge-m3 embedding model (downloaded once)
    # No depends_on for the rerankers: both are optional accelerators — the
    # bot health-checks them at startup and fails open to pre-rerank order.


  # GPU cross-encoder reranker for RAG (see docs/internal/Todo_Reranker.md).
  # Hugging Face Text Embeddings Inference serving BAAI/bge-reranker-v2-m3 on
  # GPU 1 — deliberately NOT the Unsloth Studio endpoint, which would evict the
  # main chat LLM. The bot reaches it over the compose network (http://reranker:80);
  # no host port is published. First start downloads the model (~1 GB) into the
  # shared hf-cache/ volume.
  #
  # ROLLED BACK to a profile on 2026-10-15 in favour of `reranker-qwen`
  # (Qwen3-Reranker-4B via vLLM — TEI cannot serve Qwen3ForSequenceClassification,
  # see huggingface/text-embeddings-inference#643). To run the old one again:
  #   docker compose --profile tei-rerank up -d reranker
  # and set RERANK_API_BASE=http://reranker:80, RERANK_API_FORMAT=tei in .env.
  reranker:
    profiles: ["tei-rerank"]
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    container_name: humbelchat-reranker
    restart: unless-stopped
    volumes:
      - ./hf-cache:/data        # same HF cache as the bot (separate model subdir)
    environment:
      - HF_HOME=/data
    # :latest moved under us (2026-10-15): newer TEI caps client requests at
    # --max-client-batch-size 32 (default), which rejected our RERANK_TOP_K=100
    # /rerank calls with 422. Raise the server-side cap; kb/reranker.py ALSO
    # chunks requests to <=32 so the bot survives any future TEI default.
    # Pin this tag if it moves again.
    command: --model-id BAAI/bge-reranker-v2-m3 --max-client-batch-size 128
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  # Qwen3-Reranker-4B cross-encoder for RAG (replaces the TEI bge-reranker above,
  # 2026-10-15). Served by vLLM — TEI does not support Qwen3ForSequenceClassification
  # (huggingface/text-embeddings-inference#643, still open). The bot talks to its
  # Jina-compatible /rerank endpoint: {"query", "documents", "instruction"} →
  # {"results": [{"index", "relevance_score"}]}; kb/reranker.py selects the wire
  # format via RERANK_API_FORMAT=jina and sends RERANK_INSTRUCT per request.
  #
  # 4-bit: pre-quantized compressed-tensors INT4 checkpoint (W4A16, group-128)
  # of the official Qwen3-Reranker-4B — boboliu/Qwen3-Reranker-4B-W4A16-G128
  # (~2.6 GB). vLLM supports compressed-tensors natively (in-tree), so it loads
  # in the stock pinned image with no plugin. NOTE: the earlier plan used
  # `--quantization bitsandbytes` (NF4 on the official fp16 weights), but in
  # vLLM 0.31.0 BitsAndBytes is an OUT-OF-TREE plugin (vllm-bnb-plugin) that is
  # NOT bundled in vllm/vllm-openai — that path would fail with "unknown
  # quantization". A custom Dockerfile installing the plugin is the only way to
  # keep NF4-on-official-weights; the INT4 checkpoint avoids that maintenance.
  #
  # GPU 1 budget: vLLM reserves --gpu-memory-utilization 0.5 of the 16 GB card
  # (~8 GB: INT4 weights + KV); the Ollama embedder-qwen sidecar keeps ~2.5-3 GB
  # outside that reservation. max-model-len 2048 covers our truncated pairs
  # (RERANK_MAX_CHARS=1200 chars ≈ 350 tokens + query + template overhead).
  #
  # Pinned to v0.31.0 (first release line with native Qwen3-Reranker support via
  # --hf_overrides is_original_qwen3_reranker). The chat template is vendored in
  # deploy/qwen3_reranker.jinja (vLLM's own example, Apache-2.0) — without it the
  # model scores everything with the wrong prompt format.
  # First start downloads the INT4 checkpoint (~2.6 GB) into hf-cache/.
  reranker-qwen:
    image: vllm/vllm-openai:v0.31.0
    container_name: humbelchat-reranker-qwen
    restart: unless-stopped
    environment:
      # Deterministic device indexing: the host has two different GPUs (4070 Ti
      # SUPER + 5070 Ti), and vLLM warns that without this, device "1" is not
      # guaranteed to be the PCI-bus second card.
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
    # Debug access for the dev sandbox (reaches it via host.docker.internal:8000).
    # Loopback-only on purpose: vLLM's OpenAI server has NO auth, so this must
    # never be bound to 0.0.0.0 / the LAN.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./hf-cache:/root/.cache/huggingface   # shared HF cache (bot uses /models/hf)
      - ./deploy/qwen3_reranker.jinja:/templates/qwen3_reranker.jinja:ro
    # NOTE: v0.31.0's vllm-openai image ENTRYPOINT is ["vllm", "serve"] — the
    # subcommand is baked in, so `command` must start with the model name.
    # (Older images used ENTRYPOINT ["vllm"]; a leading `serve` here makes the
    # container crash-loop with "unrecognized arguments: <model id>".)
    # --runner pooling is REQUIRED: the seq-cls architecture only exists via
    # hf_overrides (it's not in vLLM's registry), so `--runner auto` falls back
    # to "generate" and the /rerank scoring endpoint 400s. Matches vLLM's own
    # qwen3_reranker_online.py example.
    command:
      - boboliu/Qwen3-Reranker-4B-W4A16-G128
      - --runner
      - pooling
      - --quantization
      - compressed-tensors
      - --hf_overrides
      - '{"architectures": ["Qwen3ForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}'
      - --chat-template
      - /templates/qwen3_reranker.jinja
      # 0.7 (not 0.5): this card is SHARED with the Ollama embedder, and vLLM
      # subtracts other processes' VRAM from its budget. At 0.5 the INT4 weights
      # (~3 GiB) + CUDA graphs (0.7 GiB) + the resident embedder left only
      # 0.06 GiB for KV cache — below the 0.28 GiB minimum for max_model_len
      # 2048, so engine init failed with a ValueError. 0.7 leaves ~7 GiB of KV
      # headroom (a 32-pair rerank batch can hold several GiB of KV at once)
      # while still leaving room for the embedder on the shared card.
      - --gpu-memory-utilization
      - "0.7"
      - --max-model-len
      - "2048"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  # Optional Qwen3-Embedding host for the RAG embedding swap (Phase 2 — see
  # docs/internal/EVAL_QWEN3_EMBEDDING.md). Inactive unless started with
  # `docker compose --profile qwen-embed up -d embedder-qwen`.
  # After first start: `docker compose exec embedder-qwen ollama pull
  # qwen3-embedding:4b` (2.5 GB Q4_K_M — tested, quality ≈ Q8_0 ≈ 8B,
  # see EVAL_QWEN3_EMBEDDING.md) or `:4b-q8_0` (4.3 GB), then point the
  # bot at it: EMBED_URL=http://embedder-qwen:11434/v1 (+EMBEDDING_MODEL /
  # INDEX_EMBED_MODEL, /reindex_kb). Shares GPU 1 with the reranker.
  embedder-qwen:
    image: ollama/ollama:latest
    container_name: humbelchat-embedder-qwen
    profiles: ["qwen-embed"]
    restart: unless-stopped
    # Debug access for the dev sandbox (host.docker.internal:11435). Host port
    # 11435 (not 11434) so a natively installed Ollama on the host is unaffected.
    # Loopback-only, same rationale as reranker-qwen.
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ./ollama-models:/root/.ollama   # model store, outside the repo tree
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
