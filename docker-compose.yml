# ──────────────────────────────────────────────────────────────
# HumbelChat Discord bot — production deployment (see docs/docker.md)
#
#   docker compose up -d --build    # build (if needed) + start
#   docker compose logs -f bot      # live logs
#   docker compose restart bot      # graceful-ish restart
#   docker compose down             # stop
#
# All runtime state lives in the bind-mounted host directories next to this
# file: data/ (KB + vector index + recordings + history), logs/, hf-cache/
# (HuggingFace model cache). Nothing important is inside the image.
# ──────────────────────────────────────────────────────────────
services:
  bot:
    build: .
    container_name: humbelchat-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # Pin runtime data paths to the bind mounts (defaults in config/settings.py
      # resolve relative to /app, which is equivalent — explicit for clarity).
      KB_PATH: /app/data/knowledge
      RECORDINGS_DIR: /app/data/recordings
      CHARACTERS_FILE: /app/characters.json
    volumes:
      - ./data:/app/data        # KB docs + .vector_index_cache + recordings + history.json
      - ./logs:/app/logs        # RotatingFileHandler output, readable from host
      - ./hf-cache:/models/hf   # bge-m3 + whisper models (downloaded once)
    depends_on:
      - reranker

  # GPU cross-encoder reranker for RAG (see docs/internal/Todo_Reranker.md).
  # Hugging Face Text Embeddings Inference serving BAAI/bge-reranker-v2-m3 on
  # GPU 1 — deliberately NOT the Unsloth Studio endpoint, which would evict the
  # main chat LLM. The bot reaches it over the compose network (http://reranker:80);
  # no host port is published. First start downloads the model (~1 GB) into the
  # shared hf-cache/ volume.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    container_name: humbelchat-reranker
    restart: unless-stopped
    volumes:
      - ./hf-cache:/data        # same HF cache as the bot (separate model subdir)
    environment:
      - HF_HOME=/data
    command: --model-id BAAI/bge-reranker-v2-m3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
